server:
  port: 8080
  tomcat:
    # 最大连接数
    max-connections: 8192
    # 最大线程数
    max-threads: 20
    # 最小线程数
    min-spare-threads: 10
    # 连接器协议
    protocol: org.apache.coyote.http11.Http11Nio2Protocol
    # 请求队列长度
    accept-count: 100
    # 连接超时时间（毫秒）
    connection-timeout: 20000
