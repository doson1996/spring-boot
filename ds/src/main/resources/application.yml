#开发环境
env:
  host: ds.com

spring:
  application:
    name: spring-boot-demo
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    # 项目启动时自动创建数据库
    url: jdbc:mysql://${env.host}:3306/study?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
    # 项目启动时自动创建表
   # sqlScriptEncoding: utf-8
    #initializationMode: always
   # schema: classpath:sql/schema.sql
    #data: classpath:sql/data.sql
    continueOnError: true
    hikari:
      pool-name: demo-pool
      #最小空闲连接数 <类似于线程池的核心线程数>
      minimum-idle: 5
      #最大连接数 <类似于线程池的最大线程数>
      maximum-pool-size: 20
      # 监控
      register-mbeans: false
      # 项目启动时就建立连接，避免第一次使用数据库时过慢
      connection-init-sql: select 1 from dual;